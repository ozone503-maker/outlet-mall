<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Monkey Jockey &middot; Kudoken Meadows</title>
<link rel="stylesheet" href="/mall.css">
<style>
body{margin:0;background:#0B0906;color:#EFE7D2;font-family:system-ui,sans-serif;
  line-height:1.5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:28px;text-align:center}
.hold{max-width:520px}
.small{font-size:.58rem;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(239,231,210,.4)}
h1{margin:14px 0 0;font-size:clamp(2rem,10vw,3.6rem);font-weight:300;line-height:.94;
  letter-spacing:.1em;text-transform:uppercase;
  text-shadow:0 0 4px #fff,0 0 30px rgba(201,162,39,.75)}
.by{margin-top:14px;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(201,162,39,.75)}
p{color:rgba(239,231,210,.5);font-size:.86rem;margin:26px 0 0}
code{color:#C9A227;font-size:.8rem}
a{color:#C9A227}
</style>
</head>
<body>
  <div class="hold">
    <div class="small">Kudoken Meadows</div>
    <h1>Monkey Jockey</h1>
    <div class="by">Brought to you by the Kudoken</div>
    <p>The track is graded and the gate is hung. The race isn't running yet.</p>
    <p><a href="/meadows/">Back to the Meadows</a></p>
  </div>

  <!-- Game mounts here. See README.md for the contract. -->
  <div id="monkey-jockey-root" hidden></div>

  <script src="/mall.js" defer></script>
  <script src="/mall-tickets.js" defer></script>
</body>
</html>
