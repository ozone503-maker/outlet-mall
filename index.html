<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fruity Puppy Outlet Mall</title>
<link rel="stylesheet" href="/mall.css">
<style>
:root{--pad:clamp(18px,4vw,64px)}
body{margin:0;background:#0B0A08;color:#EFEAE0;
  font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
.hallway{max-width:1400px;margin:0 auto;padding:clamp(48px,12vh,120px) var(--pad) 90px}
.hallway__title{margin:0 0 clamp(48px,10vh,100px);text-align:center}
.hallway__title p{margin:0;font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:#8C826C}
.hallway__title h1{margin:.6em 0 0;font-weight:600;letter-spacing:-.025em;font-size:clamp(2rem,7vmin,4.4rem);line-height:1}
.storefronts{display:flex;flex-direction:column;gap:clamp(24px,5vh,60px);perspective:1000px}
.storefront{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(24px,5vw,48px);background:#0F0D0A;border:1px solid #241F18;border-radius:4px;transition:background 180ms cubic-bezier(.22,1,.36,1);text-decoration:none;color:inherit}
.storefront:hover{background:#16130E}
.storefront:nth-child(even) .storefront__text{order:2}
.storefront:nth-child(even) .storefront__door{order:1}
.storefront__door{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;background:#161310;border:1px solid #2A251D;border-radius:2px;min-height:240px;font-size:3.2rem;color:#8C826C;object-fit:cover;object-position:center}
.storefront__door[src]{color:auto;font-size:auto}
.storefront__text h2{margin:0;font-size:clamp(1.2rem,3vw,2rem);font-weight:600;line-height:1.1}
.storefront__text p{margin:.6em 0 0;font-size:.95rem;color:#9A9184;line-height:1.5}
.storefront.under-construction .storefront__door{background:#0F0D0A;color:#5A5248;font-size:1.2rem}
@media (max-width:680px){
  .storefront{grid-template-columns:1fr;gap:16px}
  .storefront:nth-child(even) .storefront__text{order:unset}
  .storefront:nth-child(even) .storefront__door{order:unset}
  .storefront__door{aspect-ratio:auto;min-height:160px}
}
</style>
</head>
<body>
  <div class="hallway">
    <div class="hallway__title">
      <p>Enter through any door</p>
      <h1>Fruity Puppy Outlet Mall</h1>
    </div>
    <div class="storefronts" aria-live="polite"></div>
    <noscript><p>The Outlet Mall directory needs JavaScript enabled.</p></noscript>
  </div>
  <script src="/hallway.js" defer></script>
</body>
</html>
